<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team UI</title>

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="Style.css">
</head>

<body>
    <div class="container">
        <div class="icon">
            <div class="imgbox " style="--i:0"><img class="image" src="1.jpg" alt=""></div>
            <div class="imgbox " style="--i:1"><img class="image" src="2.jpg" alt=""></div>
            <div class="imgbox " style="--i:2"><img class="image" src="3.jpg" alt=""></div>
            <div class="imgbox " style="--i:3"><img class="image" src="4.jpg" alt=""></div>
            <div class="imgbox " style="--i:4"><img class="image" src="5.jpg" alt=""></div>
            <div class="imgbox " style="--i:5"><img class="image" src="6.jpg" alt=""></div>
            <div class="imgbox " style="--i:6"><img class="image" src="7.jpg" alt=""></div>
            <div class="imgbox " style="--i:7"><img class="image" src="8.jpg" alt=""></div>
        </div>
        <div class="content active" id="content1">
            <div class="card">
                <div class="imgbx">
                    <img src="1.jpg" alt="">
                </div>
                <div class="textbox">
                    <h2>Someone Famous <br>
                        <span>Product Designer</span>
                    </h2>
                    <ul class="sci">
                        <li><a class="ic" href="#"><i class='bx bxl-facebook-square'></i></a></li>
                        <li><a class="ic" href="#"><i class='bx bxl-twitter'></i></a></li>
                        <li><a class="ic" href="#"><i class='bx bxl-linkedin-square'></i></a></li>
                        <li><a class="ic" href="#"></a><i class='bx bxl-instagram-alt'></i></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <script src="UI.js"></script>
</body>

</html>
