<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stone-Paper-Scisser</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="head">
            <div class="you">
                <h2>Player</h2>
                <h3 class="score">0</h3>
                <h1>👊</h1>
            </div>
            <div class="comp">
                <h2>Computer</h2>
                <h3 class="score">0</h3>
                <h1>👊</h1>
            </div>
        </div>
        <div class="game">
            <div>
                <div class="box" id="item1">👊</div>
                <h5>Stone</h5>
            </div>
            <div>
                <div class="box" id="item3">✌</div>
                <h5>Paper</h5>
            </div>
            <div>
                <div class="box" id="item2">✋</div>
                <h5>Scisser</h5>
            </div>
        </div>
        <div class="foot">
            <h2 class="result">Result</h2>
            <button class="btn"> New Game</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
