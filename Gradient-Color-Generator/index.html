<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Color Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <button class="btn">Random Color</button>
        <div class="slider-box">
            <input type="range" min="0" max="360" value="45" id="angle">
            <label for="angle"><span>45°</span></label>
        </div>
        <div class="color">
            <h3 class="">45°</h3>
            <h3 class="">#ed2ce2</h3>
            <h3 class=""> #7316fd</h3>
        </div>
    </div>
    <script src="color.js"></script>
</body>

</html>
