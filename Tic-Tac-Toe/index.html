<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="head">
            <h3>Tic Tac Toe</h3>
            <div class="turn-box">
                <div class="turn">X</div>
                <div class="turn">O</div>
            </div>
        </div>

        <div class="main-box">
            <div class="box align"></div>
            <div class="box align"></div>
            <div class="box align"></div>
            <div class="box align"></div>
            <div class="box align"></div>
            <div class="box align"></div>
            <div class="box align"></div>
            <div class="box align"></div>
            <div class="box align"></div>
        </div>
        <h2 id="result" class="hide"></h2>
        <button id="btn">Play Again</button>
    </div>
    <div class="var">
        
    </div>
</body>
<script src="Tic-Tac-Toe.js"></script>
</html>
