<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guess the number</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Guess the no Chaillenge</h1>

      <div class="score">
        <h3>Lifes :- 10</h3>
      </div>

      <div class="guess_no">
        <h3 class="hide">0</h3>
      </div>

      <div class="input">
        <label for="input">Enter your guessed no :- </label>
        <input type="number" id="input" />
        <button type="button" class='btn'>Guess</button>
      </div>

      <div class="result"><h3>result</h3></div>
      <button type="reset" class="btn">New Game</button>
    </div>
    <script src="Script.js"></script>
  </body>
</html>
